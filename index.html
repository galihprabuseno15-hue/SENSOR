<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Monitoring Jarak Jauh ESP32</title>
    <!-- Memuat library MQTT via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f7; text-align: center; margin: 0; padding: 30px; }
        .card { background: white; max-width: 400px; margin: auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        .metric { font-size: 52px; font-weight: bold; color: #007bff; margin: 20px 0; }
        .status { font-size: 22px; color: #28a745; font-weight: bold; margin-bottom: 15px; }
        .conn { font-size: 14px; color: #6c757d; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Dashboard Jarak Jauh</h2>
        <p>Monitoring ESP32 via Internet</p>
        
        <div class="metric" id="jarakVal">-- cm</div>
        <div class="status" id="statusVal">Menghubungkan ke Server...</div>
        <div class="conn" id="connStatus">Status: Menunggu...</div>
    </div>

    <script>
        // Menggunakan broker publik gratis yang sama
        const brokerUrl = "wss://broker.hivemq.com:8884/mqtt";
        const topic = "esp32/sensor/jarak";

        const client = mqtt.connect(brokerUrl);

        client.on("connect", () => {
            document.getElementById("connStatus").innerText = "Status: Terhubung ke Broker Internet";
            document.getElementById("statusVal").innerText = "Menunggu Data...";
            client.subscribe(topic);
        });

        client.on("message", (tp, payload) => {
            if (tp === topic) {
                try {
                    let data = JSON.parse(payload.toString());
                    document.getElementById("jarakVal").innerText = data.jarak + " cm";
                    document.getElementById("statusVal").innerText = data.status;
                } catch(e) {
                    console.log("Format data salah");
                }
            }
        });

        client.on("error", (err) => {
            document.getElementById("connStatus").innerText = "Status: Koneksi Gagal";
            console.error(err);
        });
    </script>
</body>
</html>
